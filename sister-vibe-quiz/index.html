 {id:'team',name:'定海配合型',en:'THE STEADY ONE',tone:['#c9dbd2','#e7ddd0'],tag:'你不一定站C位，但你让大家都安心。',lead:'你不抢聚光灯，却常常是事情顺利发生的原因。可靠不是一句口号，是每一次说到做到。',people:[['Ella陈嘉桦','能带动气氛，也能把大家照顾到'],['孙怡','自然亲和，相处起来不费力'],['张月','温柔配合，也能稳稳接住任务'],['叶童','安定有力量，让人觉得很踏实']],scenes:['你会主动留意谁还没被照顾到。','分工清楚后执行力在线，别人放心把事交给你。','习惯用陪伴和行动表示在乎。'],match:'与愿意看见你的付出、也能替你分担的人组队最好。',flaw:'太会说“我来吧”，偶尔忘了问自己“我还有没有力气”；被照顾也不丢分。'},
 {id:'relaxed',name:'松弛自洽型',en:'MY OWN RHYTHM',tone:['#d8d4e2','#dce1d3'],tag:'你有自己的时区，不必追赶所有时钟。',lead:'你知道生活不是一张必须填满的待办清单。该认真的时候认真，该放松的时候，也允许自己好好生活。',people:[['黄龄','自有风格，按喜欢的方式表达自己'],['薛凯琪','轻盈柔和，也保留独特的节奏'],['萧蔷','从容自在，有自己的生活步调'],['李小冉','清清爽爽，不轻易被外界带着走']],scenes:['热闹能参与，独处也能过得有滋有味。','比起盲目拼速度，你更看重事情做得是否舒服。','喜欢有空间感、不过度控制彼此的关系。'],match:'和尊重不同节奏、不会把忙碌当唯一价值的人很舒服。',flaw:'太擅长顺其自然，偶尔会把该回复的消息也“顺”到明天；重要的事还是记得设个提醒。'}
];
const traits=['D','S','R','L','E','A','G'];
let state={step:-1,answers:Array(questions.length).fill(null)};
const app=document.querySelector('#app');
function scrollUp(){window.scrollTo({top:0,behavior:'instant'})}
function cover(){state.step=-1;app.innerHTML=`<div class="page"><div class="hero"><div class="overline">17 LITTLE CHOICES · 7 PERSONALITY VIBES</div><h1 class="title">测测你是<br><em>浪姐里的哪位姐姐</em></h1><p class="sub-title">你的性格底色是哪一型？</p><p class="intro">不聊舞台，不猜明星。只用生活里那些真实的小选择，看看你更接近哪一种「姐姐人格」。<br>每一种性格，都有自己的闪光方式。</p><div class="poster" aria-hidden="true"><span class="orb orb-one"></span><span class="orb orb-two"></span><span class="orb orb-three"></span><span class="spark spark-one">✳</span><span class="spark spark-two">✦</span><span class="poster-word">be your vibe.</span><span class="poster-small">不同的你，同样闪闪发光</span></div><div class="chips"><span class="chip">✦ 17道真实生活题</span><span class="chip">♡ 约3分钟</span><span class="chip">☼ 7种性格底色</span></div><button class="primary button-wide" id="start">开启我的姐姐人格测试　→</button><div class="foot-note">凭第一反应选择就好，没有标准答案。<br>轻松趣味测试 · 不是专业心理测量或诊断</div></div></div>`;document.querySelector('#start').onclick=()=>{state.answers=Array(questions.length).fill(null);question(0)};scrollUp()}
function question(i){state.step=i;const q=questions[i];const chosen=state.answers[i];app.innerHTML=`<div class="page"><div class="progress-head"><span>YOUR LITTLE CHOICES</span><span class="counter"><b>${String(i+1).padStart(2,'0')}</b> / ${questions.length}</span></div><div class="track" role="progressbar" aria-valuenow="${i+1}" aria-valuemin="1" aria-valuemax="${questions.length}" aria-label="答题进度"><span style="width:${(i+1)/questions.length*100}%"></span></div><div class="question-wrap"><span class="q-topic">✳ ${q.area}</span><h2 class="question">${q.q}</h2><span class="q-hint">想象自己真的身处这个场景，选最像你的反应。</span><div class="options" role="group" aria-label="单选答案">${q.a.map((opt,n)=>`<button class="option ${chosen===n?'selected':''}" aria-pressed="${chosen===n}" data-choice="${n}"><span class="letter">${'ABCD'[n]}</span><span>${opt[0]}</span></button>`).join('')}</div><div style="flex:1"></div><div class="q-actions"><button class="back" id="back">← 上一题</button><button class="primary" id="next" ${chosen===null?'disabled':''}>${i===questions.length-1?'查看我的测试结果 ✦':'下一题　→'}</button></div><p class="foot-note">不用迎合“更好”的答案，真实的你就很好。</p></div></div>`;
document.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{state.answers[i]=Number(btn.dataset.choice);document.querySelectorAll('[data-choice]').forEach(x=>{const yes=x===btn;x.classList.toggle('selected',yes);x.setAttribute('aria-pressed',yes)});document.querySelector('#next').disabled=false});document.querySelector('#back').onclick=()=>i===0?cover():question(i-1);document.querySelector('#next').onclick=()=>{if(state.answers[i]===null)return;i+1===questions.length?result(calculate()):question(i+1)};scrollUp()}
function calculate(){const sums=Object.fromEntries(traits.map(t=>[t,0]));const mins=Object.fromEntries(traits.map(t=>[t,0]));const maxs=Object.fromEntries(traits.map(t=>[t,0]));questions.forEach((q,i)=>{for(const t of traits){const values=q.a.map(opt=>(t===q.d?opt[1]:0)+(opt[2]?.[t]||0));mins[t]+=Math.min(...values);maxs[t]+=Math.max(...values);const opt=q.a[state.answers[i]];sums[t]+=(t===q.d?opt[1]:0)+(opt[2]?.[t]||0)}});const v=Object.fromEntries(traits.map(t=>[t,(sums[t]-mins[t])/(maxs[t]-mins[t]||1)]));const archetypes={captain:[.92,.55,.65,.43,.48,.78,.67],soft:[.44,.57,.94,.54,.87,.47,.69],boundary:[.45,.34,.62,.65,.60,.67,.49],direct:[.67,.74,.63,.65,.45,.98,.59],drive:[.71,.50,.98,.25,.44,.63,.97],team:[.33,.59,.70,.51,.96,.44,.55],relaxed:[.38,.39,.50,.97,.50,.72,.34]};let ranked=profiles.map(p=>{const target=archetypes[p.id];const diff=traits.reduce((s,t,j)=>s+Math.pow(v[t]-target[j],2)*(t==='D'||t==='R'||t==='L'||t==='E'||t==='A'||t==='G'?1.1:0.78),0);return{id:p.id,score:diff}}).sort((a,b)=>a.score-b.score);return ranked[0].id}
function result(id){const p=profiles.find(x=>x.id===id);if(!p){cover();return}state.step=questions.length;let url=new URL(location.href);url.searchParams.set('result',p.id);const share=url.toString();app.innerHTML=`<div class="page"><div class="result-intro"><div class="result-brow">✦ YOUR SISTER VIBE REVEAL ✦</div><h1 class="result-title">${p.name}</h1><p class="result-tag">${p.tag}</p></div><article class="result-card"><div class="color-banner" style="--tone1:${p.tone[0]};--tone2:${p.tone[1]}"><span class="banner-letter">${p.en}</span><span class="banner-num">SISTER TYPE · 0${profiles.indexOf(p)+1}</span></div><div class="card-body"><div class="eyebrow">写给这样的你 ♡</div><p class="result-lead">${p.lead}</p><div class="section"><h3>☼ 你在生活中的样子</h3><div class="scene"><b>社交里</b><span>${p.scenes[0]}</span></div><div class="scene"><b>职场里</b><span>${p.scenes[1]}</span></div><div class="scene"><b>关系里</b><span>${p.scenes[2]}</span></div></div><div class="section"><h3>♡ 和谁相处更舒服？</h3><p>${p.match}</p></div><div class="section"><h3>✳ 一点点可爱的反差</h3><p>${p.flaw}</p></div><div class="section"><h3>✦ 你的姐姐氛围参考</h3><p style="margin-bottom:12px">不是说你和她们完全一样，而是你们身上有相似的气质切面。</p><div class="people">${p.people.map(person=>`<div class="person"><div class="person-name">${person[0]}</div><div class="person-note">${person[1]}</div></div>`).join('')}</div></div></div></article><div class="result-footer"><button class="primary" id="restart">↻ 重新测试</button><button class="secondary" id="copy">♡ 复制我的结果分享链接</button><p class="disclaimer">适合截图留念 · 7种人格都值得闪闪发光<br>本测试仅为娱乐性格探索；人物侧写为公开形象的创意联想，不代表对真人的心理评判。</p></div></div>`;document.querySelector('#restart').onclick=()=>{history.replaceState(null,'',location.pathname);state.answers=Array(questions.length).fill(null);cover()};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(share);toast('结果链接已复制 ♡')}catch(e){const el=document.createElement('textarea');el.value=share;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('结果链接已复制 ♡')}catch(e){toast('可复制浏览器地址分享')}el.remove()}};scrollUp()}
function toast(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2100)}
const preview=new URL(location.href).searchParams.get('result');profiles.some(p=>p.id===preview)?result(preview):cover();
})();
</script>
